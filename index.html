<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📦 재고관리</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8e8b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="재고관리">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root{
    --primary:   #ff8e8b;
    --secondary: #e64980;
    --bg:        #f4f7f6;
    --success:   #20c997;
    --info:      #4263eb;
    --danger:    #e24b4a;
    --line:      #e9ecef;
    --text:      #343a40;
    --muted:     #868e96;
    --card-shadow: 0 3px 12px rgba(0,0,0,.05);
    --radius:    16px;
}
*, *::before, *::after{ box-sizing: border-box; }
html, body{ margin:0; padding:0; }
body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
    font-weight: 500;
    -webkit-text-size-adjust: 100%;
}
button, input, select, textarea{ font-family: inherit; font-size: inherit; color: inherit; }
button{ cursor: pointer; }
.container{ max-width: 1080px; margin: 0 auto; padding: 12px 12px 60px; }
.hidden{ display: none !important; }

/* ================== [헤더 · 가로 반절 & 세로 약 2.5cm 탭] ================== */
.app-header{
    background:#fff;
    border-bottom:1px solid var(--line);
    position: sticky; top:0; z-index: 100;
}
.app-header .inner{
    max-width:1080px; margin:0 auto; padding:8px 12px;
    display:flex; align-items:center; gap:8px;
}
.app-title{
    font-size:17px; font-weight:800; color:var(--secondary);
    margin:0; letter-spacing:-.4px; white-space:nowrap;
}
.conn-badge{
    font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px;
    background:#f1f3f5; color:var(--muted); white-space:nowrap;
}
.conn-badge.cloud{ background:#e6fcf5; color:#0ca678; }
.conn-badge.local{ background:#fff4e6; color:#e8590c; }
.header-spacer{ flex:1 1 auto; }

/* 가로 정확히 반절(1fr 1fr), 세로 길이 약 2.5cm(88px) */
.tab-menu{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    max-width:1080px; margin:0 auto; padding:4px 12px 12px;
}
.tab-btn{
    border:2px solid var(--line); background:#f8f9fa; color:var(--muted);
    font-weight:800; font-size:19px; height:88px; border-radius:18px;
    transition: all .12s; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
}
.tab-btn .t-ico{ font-size:24px; line-height:1; }
.tab-btn:active{ transform:scale(.98); }
.tab-btn.active{
    background:var(--primary); border-color:var(--primary); color:#fff;
    box-shadow:0 5px 14px rgba(255,142,139,.38);
}

/* ================== [공통 부품] ================== */
.card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--card-shadow); padding:16px;
}
.section-title{
    font-size:16.5px; font-weight:800; margin:0 0 14px; color:var(--text);
    display:flex; align-items:center; gap:6px;
}
.btn{
    border:none; border-radius:11px; padding:10px 16px; font-weight:800; font-size:14.5px;
    background:#f1f3f5; color:var(--text); min-height:42px; white-space:nowrap;
}
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-primary{ background:var(--primary); color:#fff; }
.btn-success{ background:var(--success); color:#fff; }
.btn-info{ background:var(--info); color:#fff; }
.btn-danger{ background:var(--danger); color:#fff; }
.btn-ghost{ background:#fff; border:1px solid var(--line); }
.btn-sm{ padding:5px 10px; font-size:12.5px; min-height:32px; border-radius:8px; }

.empty-msg{
    text-align:center; color:var(--muted); font-weight:600;
    padding:50px 20px; line-height:1.7;
}
.empty-msg .big{ font-size:38px; display:block; margin-bottom:10px; }

/* ================== [검색 툴바] ================== */
.toolbar{
    display:flex; gap:6px; flex-wrap:wrap; align-items:center;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:9px 10px; box-shadow:var(--card-shadow); margin-bottom:10px;
}
.search-wrap{ position:relative; flex:1 1 160px; min-width:0; }
.search-wrap .ico{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    font-size:13.5px; pointer-events:none;
}
.search-wrap input{
    width:100%; border:1px solid var(--line); border-radius:10px;
    padding:7px 10px 7px 30px; font-weight:600; font-size:13.5px; outline:none; min-height:36px;
}
.search-wrap input:focus{ border-color:var(--primary); }
.toolbar select{
    border:1px solid var(--line); border-radius:10px; padding:6px 8px;
    font-weight:700; font-size:13px; background:#fff; outline:none; min-height:36px;
}
.chip{
    border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:5px 10px; font-size:12px; font-weight:700; color:var(--muted); min-height:30px;
}
.chip.on{ background:var(--secondary); border-color:var(--secondary); color:#fff; }
.count-label{ font-size:12px; font-weight:700; color:var(--muted); margin-left:auto; }

/* ================== [제품 카드 격자] ================== */
.item-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px;
}
.item-card{
    position:relative;
    background:#fff; border:1px solid var(--line); border-radius:15px;
    box-shadow:var(--card-shadow); overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; min-width:0;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
}
.del-overlay{
    position:absolute; inset:0; background:rgba(33,37,41,.88);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; z-index:25; padding:14px; border-radius:15px; animation:pop .12s ease-out;
}
.item-card.show-del .del-overlay{ display:flex; }

.item-photo{
    position:relative; width:100%; aspect-ratio:4/3; background:#f1f3f5;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.item-photo img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.item-photo .noimg{ font-size:34px; opacity:.35; }
.item-photo .ph-slot{
    position:absolute; inset:0; background:#f1f3f5;
    animation: phPulse 1.1s ease-in-out infinite;
}
@keyframes phPulse{ 0%,100%{ background:#f1f3f5 } 50%{ background:#e9ecef } }

.owner-badge{
    position:absolute; top:7px; left:7px;
    padding:3px 8px; border-radius:999px; font-size:11.5px; font-weight:800;
    background:rgba(33,37,41,.78); color:#fff; max-width:60%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.stock-badge{
    position:absolute; top:7px; right:7px;
    padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:800;
    background:rgba(32,201,151,.96); color:#fff;
}
.stock-badge.out{ background:rgba(226,75,74,.94); }

.item-body{ padding:10px 11px 11px; display:flex; flex-direction:column; gap:5px; flex:1; min-width:0; }
.item-top-meta{
    font-size:11.5px; font-weight:700; color:var(--muted);
    display:flex; justify-content:space-between; gap:4px;
}
.item-name{
    font-size:14.5px; font-weight:800; line-height:1.3; word-break:keep-all;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.price-box{
    display:flex; align-items:baseline; justify-content:space-between; gap:4px;
    background:#f8f9fa; padding:6px 8px; border-radius:9px; margin-top:2px;
}
.price-main{ font-size:15.5px; font-weight:800; color:var(--secondary); letter-spacing:-.4px; }
.price-cost{ font-size:11.5px; font-weight:700; color:var(--muted); }
.price-edit-btn{
    border:1px solid var(--line); background:#fff; border-radius:6px;
    font-size:11px; font-weight:800; padding:3px 6px; color:var(--info); white-space:nowrap;
}

.last-log{
    font-size:11px; font-weight:700; color:#495057; background:#fff9db;
    padding:4px 7px; border-radius:6px; line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.qty-ctrl{
    display:flex; gap:4px; margin-top:auto; padding-top:6px; align-items:center;
}
.q-btn{
    border:1px solid var(--line); background:#f8f9fa; border-radius:8px;
    font-size:15px; font-weight:800; min-height:34px; width:32px;
    display:flex; align-items:center; justify-content:center;
}
.q-btn:active{ background:#e9ecef; }
.q-settle{
    flex:1; border:1px solid #96f2d7; background:#e6fcf5; color:#0ca678;
    border-radius:8px; font-size:12px; font-weight:800; min-height:34px;
    padding:0 4px; text-align:center; white-space:nowrap;
}

/* ================== [등록 폼] ================== */
.form-wrap{ max-width:680px; margin:0 auto; }
.form-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
.field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.field label{ font-size:13px; font-weight:800; color:var(--text); }
.field label .opt{ font-weight:600; color:var(--muted); font-size:11.5px; }
.field input, .field textarea{
    border:1px solid var(--line); border-radius:11px; padding:10px 12px;
    font-weight:700; font-size:14.5px; outline:none; background:#fff; min-height:42px; width:100%;
}
.field input:focus, .field textarea:focus{ border-color:var(--primary); }
.field textarea{ resize:none; min-height:64px; line-height:1.5; }
.field .hint{ font-size:11.5px; font-weight:700; color:var(--info); min-height:14px; }

.photo-box{
    border:2px dashed #dee2e6; border-radius:14px; background:#fff;
    padding:12px; text-align:center; margin-bottom:14px;
}
.photo-preview{
    width:100%; max-width:300px; aspect-ratio:4/3; margin:0 auto 10px;
    border-radius:10px; background:#f1f3f5; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
}
.photo-preview img{ width:100%; height:100%; object-fit:contain; }
.photo-preview .ph{ color:var(--muted); font-weight:700; font-size:13px; line-height:1.6; }
.photo-preview .ph .big{ font-size:32px; display:block; }
.photo-btns{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.form-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }

/* ================== [모달 & 이력 리스트] ================== */
.modal-back{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:500;
    display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal{
    background:#fff; border-radius:18px; width:100%; max-width:520px;
    max-height:90vh; overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,.25);
    animation: pop .15s ease-out;
}
@keyframes pop{ from{ transform:scale(.97); opacity:0; } to{ transform:scale(1); opacity:1; } }
.modal-head{
    display:flex; align-items:center; gap:8px; padding:15px 18px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:5;
}
.modal-head h3{ margin:0; font-size:16.5px; font-weight:800; flex:1; word-break:keep-all; }
.modal-close{
    border:none; background:#f1f3f5; width:32px; height:32px; border-radius:9px;
    font-size:16px; font-weight:800; color:var(--muted);
}
.modal-body{ padding:18px; }
.modal-foot{ display:flex; gap:8px; padding:0 18px 18px; flex-wrap:wrap; }
.modal-foot .btn{ flex:1 1 auto; }

.detail-photo{
    width:100%; border-radius:12px; background:#f1f3f5; margin-bottom:14px;
    aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.detail-photo img{ width:100%; height:100%; object-fit:contain; }
.kv{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
.kv .k{ font-weight:700; color:var(--muted); }
.kv .v{ font-weight:800; text-align:right; }

.log-box{
    margin-top:14px; background:#f8f9fa; border:1px solid var(--line);
    border-radius:12px; padding:12px;
}
.log-title{ font-size:13.5px; font-weight:800; margin:0 0 8px; color:var(--text); }
.log-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; }
.log-item{
    font-size:13px; font-weight:700; padding:7px 9px; border-radius:8px;
    background:#fff; border:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center;
}
.log-item .l-date{ color:var(--muted); font-size:12px; white-space:nowrap; }
.log-item .l-txt{ flex:1; word-break:keep-all; }
.log-item.sale{ border-left:3px solid var(--success); }
.log-item.price{ border-left:3px solid var(--info); }
.log-item.in{ border-left:3px solid var(--primary); }

/* ================== [토스트 · 로딩] ================== */
#toastBox{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    z-index:900; display:flex; flex-direction:column; gap:6px; align-items:center;
    pointer-events:none; width:calc(100% - 32px); max-width:400px;
}
.toast{
    background:rgba(33,37,41,.95); color:#fff; font-weight:700; font-size:14px;
    padding:11px 18px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,.2);
    text-align:center; word-break:keep-all;
}
.toast.ok{ background:rgba(32,201,151,.96); }
.toast.err{ background:rgba(226,75,74,.96); }

#loadingVeil{
    position:fixed; inset:0; background:rgba(255,255,255,.72); z-index:800;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px;
    font-weight:800; color:var(--secondary);
}
.spinner{
    width:34px; height:34px; border:4px solid #ffe3e3; border-top-color:var(--primary);
    border-radius:50%; animation: spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

@media (max-width: 768px){
    .item-grid{ grid-template-columns:repeat(2, 1fr); gap:9px; }
    .form-grid{ grid-template-columns:repeat(2, 1fr); gap:10px; }
    .modal-back{ align-items:flex-end; padding:0; }
    .modal{ border-radius:18px 18px 0 0; max-height:92vh; }
}
</style>
</head>
<body>

<header class="app-header">
    <div class="inner">
        <h1 class="app-title">📦 재고관리</h1>
        <span class="conn-badge" id="connBadge">연결 확인 중…</span>
        <span class="header-spacer"></span>
        <button class="btn btn-ghost btn-sm" id="refreshBtn">🔄 새로고침</button>
    </div>
    <!-- 가로 반절(5:5), 세로 약 2.5cm(88px) 큼직한 2개 버튼 -->
    <nav class="tab-menu">
        <button class="tab-btn active" data-tab="list">
            <span class="t-ico">📦</span>
            <span>재고 관리</span>
        </button>
        <button class="tab-btn" data-tab="form">
            <span class="t-ico">➕</span>
            <span>제품 등록</span>
        </button>
    </nav>
</header>

<main class="container">

    <!-- =================== 1. 재고 관리 (목록) =================== -->
    <section id="tab-list">
        <div class="toolbar">
            <div class="search-wrap">
                <span class="ico">🔍</span>
                <input type="text" id="searchInput" placeholder="제품명 · 누구 꺼 검색…" autocomplete="off">
            </div>
            <select id="sortSelect">
                <option value="inDate_desc">📅 최근 입고순</option>
                <option value="inDate_asc">📅 오래된 입고순</option>
                <option value="name_asc">🔤 이름순</option>
                <option value="qty_desc">📦 재고 많은순</option>
            </select>
            <button class="chip on" data-filter="all">전체</button>
            <button class="chip" data-filter="instock">남음</button>
            <button class="chip" data-filter="sold">품절</button>
            <span class="count-label" id="countLabel"></span>
        </div>

        <div style="font-size:12px; font-weight:700; color:var(--muted); margin:0 0 8px 4px;">
            💡 카드를 <b>길게 누르면 삭제</b> · <b>남은수량 버튼</b>을 누르면 마감 정산됩니다.
        </div>

        <div class="item-grid" id="itemGrid"></div>
        <div class="empty-msg hidden" id="listEmpty">
            <span class="big">📭</span>
            등록된 제품이 없습니다.<br>오른쪽 위 <b>➕ 제품 등록</b> 버튼을 눌러 올려보세요.
        </div>
    </section>

    <!-- =================== 2. 제품 등록 =================== -->
    <section id="tab-form" class="hidden">
        <div class="form-wrap">
            <div class="card">
                <h2 class="section-title" id="formTitle">➕ 제품 등록</h2>

                <div class="photo-box" id="photoBox">
                    <div class="photo-preview" id="photoPreview">
                        <div class="ph"><span class="big">📷</span>사진 올리기 (선택)</div>
                    </div>
                    <div class="photo-btns">
                        <button type="button" class="btn btn-primary btn-sm" id="captureBtn">📷 카메라 촬영</button>
                        <button type="button" class="btn btn-ghost btn-sm" id="pickBtn">🖼️ 앨범에서 선택</button>
                        <button type="button" class="btn btn-ghost btn-sm hidden" id="photoClearBtn">🗑️ 사진 빼기</button>
                    </div>
                    <input type="file" id="captureInput" accept="image/*" capture="environment" class="hidden">
                    <input type="file" id="pickInput" accept="image/*" class="hidden">
                </div>

                <div class="form-grid" style="margin-bottom:12px">
                    <div class="field" style="grid-column: span 2;">
                        <label for="fName">🏷️ 제품 이름</label>
                        <input type="text" id="fName" placeholder="예) 사과 5kg 박스" maxlength="80" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="fOwner">👤 누구 꺼 <span class="opt">(입고처)</span></label>
                        <input type="text" id="fOwner" placeholder="예) 김철수 / 청과" maxlength="40" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="fDate">📅 입고날짜</label>
                        <input type="date" id="fDate">
                    </div>
                    <div class="field">
                        <label for="fCost">🔨 원가 <span class="opt">(입고가)</span></label>
                        <input type="number" id="fCost" min="0" step="1" inputmode="numeric" placeholder="10000">
                        <div class="hint" id="hCost"></div>
                    </div>
                    <div class="field">
                        <label for="fSale">💵 실판매가 <span class="opt">(파는 값)</span></label>
                        <input type="number" id="fSale" min="0" step="1" inputmode="numeric" placeholder="13000">
                        <div class="hint" id="hSale"></div>
                    </div>
                    <div class="field" style="grid-column: span 2;">
                        <label for="fQty">📦 입고 수량 (개수)</label>
                        <input type="number" id="fQty" min="0" step="1" inputmode="numeric" placeholder="30">
                    </div>
                </div>

                <div class="field">
                    <label for="fMemo">📝 메모 <span class="opt">(선택)</span></label>
                    <textarea id="fMemo" rows="2" placeholder="특이사항이나 보관 위치 등"></textarea>
                </div>

                <div class="form-actions">
                    <button class="btn btn-ghost" id="formResetBtn">↩️ 초기화</button>
                    <button class="btn btn-info" id="formSaveNextBtn">➕ 저장 후 계속 등록</button>
                    <button class="btn btn-primary" id="formSaveBtn">💾 저장하기</button>
                </div>
            </div>
        </div>
    </section>

</main>

<div id="toastBox"></div>
<div id="modalRoot"></div>
<div id="loadingVeil" class="hidden"><div class="spinner"></div><span id="loadingText">불러오는 중…</span></div>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* ================== [공통 유틸] ================== */
function esc(s){
    return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function todayStr(d){
    var t = d || new Date();

/* ================== [이미지 압축] ================== */
function loadBitmap(file){
    if(window.createImageBitmap){
        return createImageBitmap(file, { imageOrientation: 'from-image' })
            .catch(function(){ return loadViaImg(file); });
    }
    return loadViaImg(file);
}
function loadViaImg(file){
    return new Promise(function(resolve, reject){
        var reader = new FileReader();
        reader.onload = function(){
            var img = new Image();
            img.onload = function(){ resolve(img); };
            img.onerror = function(){ reject(new Error('이미지 읽기 실패')); };
            img.src = reader.result;
        };
        reader.onerror = function(){ reject(new Error('파일 읽기 실패')); };
        reader.readAsDataURL(file);
    });
}
function drawToJpeg(src, maxSide, quality){
    var w = src.width, h = src.height;
    if(w >= h){ if(w > maxSide){ h = Math.round(h * maxSide / w); w = maxSide; } }
    else{ if(h > maxSide){ w = Math.round(w * maxSide / h); h = maxSide; } }
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(src, 0, 0, w, h);
    return c.toDataURL('image/jpeg', quality);
}
function drawThumb(src, w, h, quality){
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
    var sw = src.width, sh = src.height;
    var want = w / h, have = sw / sh;
    var cw = sw, ch = sh;
    if(have > want) cw = Math.round(sh * want);
    else            ch = Math.round(sw / want);
    var sx = Math.round((sw - cw) / 2), sy = Math.round((sh - ch) / 2);
    ctx.drawImage(src, sx, sy, cw, ch, 0, 0, w, h);
    return c.toDataURL('image/jpeg', quality);
}
function makePhotoPair(file){
    return loadBitmap(file).then(function(src){
        var full  = drawToJpeg(src, PHOTO_MAX_SIDE, PHOTO_QUALITY);
        var thumb = drawThumb(src, THUMB_W, THUMB_H, THUMB_QUALITY);
        if(src.close) src.close();
        return { full: full, thumb: thumb };
    });
}

/* ================== [로컬 & 클라우드 저장소] ================== */
var LocalDB = (function(){
    var dbp = null;
    function open(){
        if(dbp) return dbp;
        dbp = new Promise(function(resolve, reject){
            var req = indexedDB.open('inventory_local', 2);
            req.onupgradeneeded = function(e){
                var db = e.target.result;
                if(!db.objectStoreNames.contains('items'))  db.createObjectStore('items',  { keyPath: 'id' });
                if(!db.objectStoreNames.contains('thumbs')) db.createObjectStore('thumbs', { keyPath: 'id' });
                if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id' });
                if(!db.objectStoreNames.contains('sales'))  db.createObjectStore('sales',  { keyPath: 'id' });
            };
            req.onsuccess = function(){ resolve(req.result); };
            req.onerror   = function(){ reject(req.error); };
        });
        return dbp;
    }
    function run(store, mode, fn){
        return open().then(function(db){
            return new Promise(function(resolve, reject){
                var tx = db.transaction(store, mode);
                var req = fn(tx.objectStore(store));
                req.onsuccess = function(){ resolve(req.result); };
                req.onerror   = function(){ reject(req.error); };
            });
        });
    }
    return {
        all: function(s){ return run(s, 'readonly',  function(os){ return os.getAll(); }); },
        get: function(s, id){ return run(s, 'readonly',  function(os){ return os.get(id); }); },
        put: function(s, val){ return run(s, 'readwrite', function(os){ return os.put(val); }); },
        del: function(s, id){ return run(s, 'readwrite', function(os){ return os.delete(id); }); }
    };
})();

var Store = {
    mode: 'local', error: '', db: null,
    init: function(){
        var self = this;
        var cfgOk = firebaseConfig && firebaseConfig.projectId && firebaseConfig.apiKey;
        if(!cfgOk){ self.mode = 'local'; return Promise.resolve(); }
        try{
            firebase.initializeApp(firebaseConfig);
            self.db = firebase.firestore();
            self.db.enablePersistence({ synchronizeTabs: true }).catch(function(){});
            self.mode = 'cloud';
        }catch(e){
            self.mode = 'local';
            self.error = e.message || String(e);
        }
        return Promise.resolve();
    },
    listItems: function(){
        if(this.mode !== 'cloud') return LocalDB.all('items');
        return this.db.collection(COL_ITEMS)
            .orderBy('createdAt', 'desc').limit(LOAD_LIMIT_ITEMS).get()
            .then(function(snap){
                var out = [];
                snap.forEach(function(d){ var v = d.data(); v.id = d.id; out.push(v); });
                return out;
            });
    },
    saveItem: function(item){
        if(this.mode !== 'cloud'){
            return LocalDB.get('items', item.id).then(function(prev){
                return LocalDB.put('items', Object.assign({}, prev || {}, item));
            });
        }
        return this.db.collection(COL_ITEMS).doc(item.id).set(item, { merge: true });
    },
    deleteItem: function(id){
        if(this.mode !== 'cloud') return LocalDB.del('items', id);
        return this.db.collection(COL_ITEMS).doc(id).delete();
    },
    getThumb: function(id){
        if(this.mode !== 'cloud') return LocalDB.get('thumbs', id).then(function(r){ return r ? r.data : ''; });
        return this.db.collection(COL_THUMBS).doc(id).get().then(function(d){ return d.exists ? (d.data().data || '') : ''; });
    },
    saveThumb: function(id, dataUrl){
        if(this.mode !== 'cloud') return LocalDB.put('thumbs', { id: id, data: dataUrl });
        return this.db.collection(COL_THUMBS).doc(id).set({ data: dataUrl });
    },
    deleteThumb: function(id){
        if(this.mode !== 'cloud') return LocalDB.del('thumbs', id);
        return this.db.collection(COL_THUMBS).doc(id).delete().catch(function(){});
    },
    dropInlineThumb: function(id){
        if(this.mode !== 'cloud') return Promise.resolve();
        return this.db.collection(COL_ITEMS).doc(id).update({ thumb: firebase.firestore.FieldValue.delete() }).catch(function(){});
    },
    getPhoto: function(id){
        if(this.mode !== 'cloud') return LocalDB.get('photos', id).then(function(r){ return r ? r.data : ''; });
        return this.db.collection(COL_PHOTOS).doc(id).get().then(function(d){ return d.exists ? (d.data().data || '') : ''; });
    },
    savePhoto: function(id, dataUrl){
        if(this.mode !== 'cloud') return LocalDB.put('photos', { id: id, data: dataUrl });
        return this.db.collection(COL_PHOTOS).doc(id).set({ data: dataUrl });
    },
    deletePhoto: function(id){
        if(this.mode !== 'cloud') return LocalDB.del('photos', id);
        return this.db.collection(COL_PHOTOS).doc(id).delete().catch(function(){});
    }
};

function getCost(it){
    return Number(it.costPrice != null ? it.costPrice : (it.auctionPrice || it.originalPrice || 0)) || 0;
}
function getLogs(it){
    return Array.isArray(it.logs) ? it.logs : [];
}

/** 옛 방식으로 제품 안에 들어있던 썸네일을 백그라운드에서 조용히 알아서 분리·정리합니다 */
function autoCleanLegacyPhotos(){
    var legacy = state.items.filter(function(it){ return !!it.thumb; });
    if(!legacy.length) return;
    legacy.forEach(function(it){
        var inlineData = it.thumb;
        state.thumbs[it.id] = inlineData;
        Store.saveThumb(it.id, inlineData)
            .then(function(){
                if(!it.hasPhoto){
                    it.hasPhoto = true;
                    return Store.saveItem({ id: it.id, hasPhoto: true });
                }
            })
            .then(function(){ return Store.dropInlineThumb(it.id); })
            .then(function(){ delete it.thumb; })
            .catch(function(){});
    });
}

function visibleItems(){
    var q = state.search.trim().toLowerCase();
    var list = state.items.filter(function(it){
        var qty = Number(it.qty) || 0;
        if(state.filter === 'instock' && qty <= 0) return false;
        if(state.filter === 'sold'    && qty >  0) return false;
        if(q){
            var hay = ((it.name || '') + ' ' + (it.owner || '') + ' ' + (it.memo || '')).toLowerCase();
            if(hay.indexOf(q) < 0) return false;
        }
        return true;
    });

    var by = state.sort;
    list.sort(function(a, b){
        switch(by){
            case 'inDate_asc': return String(a.inDate || '').localeCompare(String(b.inDate || ''));
            case 'name_asc':   return String(a.name || '').localeCompare(String(b.name || ''), 'ko');
            case 'qty_desc':   return (Number(b.qty) || 0) - (Number(a.qty) || 0);
            default:           return String(b.inDate || '').localeCompare(String(a.inDate || ''));
        }
    });
    return list;
}

function thumbPut(box, id, dataUrl){
    if(!box || !dataUrl || box.getAttribute('data-thumb') !== id) return;
    var slot = box.querySelector('.ph-slot');
    if(!slot) return;
    var img = new Image();
    img.alt = ''; img.decoding = 'async'; img.src = dataUrl;
    slot.replaceWith(img);
    box.removeAttribute('data-thumb');
}
function thumbFill(box, id){
    if(!id) return;
    if(state.thumbs[id]){ thumbPut(box, id, state.thumbs[id]); return; }
    if(state.thumbBusy[id]) return;
    state.thumbBusy[id] = true;
    Store.getThumb(id).then(function(data){
        delete state.thumbBusy[id];
        if(!data) return;
        state.thumbs[id] = data;
        var now = document.querySelector('.item-photo[data-thumb="' + id + '"]');
        thumbPut(now || box, id, data);
    }).catch(function(){ delete state.thumbBusy[id]; });
}
function thumbWatch(){
    var grid = document.getElementById('itemGrid');
    if(!grid) return;
    grid.querySelectorAll('.item-photo[data-thumb]').forEach(function(box){
        thumbFill(box, box.getAttribute('data-thumb'));

    calcDiff();

        var rem = Math.max(0, Number(remEl.value) || 0);
        var dt  = document.getElementById('stDate').value || todayStr();
        applyQtyChange(it, rem, dt);
        closeModal();
    };
}

function applyQtyChange(it, nextQty, dateStr){
    var prevQty = Number(it.qty) || 0;
    if(nextQty === prevQty) return;
    var diff = prevQty - nextQty;
    var sale = Number(it.salePrice) || 0;
    var dStr = dateStr || todayStr();

    var logs = getLogs(it).slice();
    if(diff > 0){
        logs.unshift({
            type: 'sale',
            date: dStr,
            text: num(diff) + '개 판매 (실판매가 ' + won(sale) + ' · 잔여 ' + num(nextQty) + '개)'
        });
    }else{
        logs.unshift({
            type: 'in',
            date: dStr,
            text: num(-diff) + '개 추가 (잔여 ' + num(nextQty) + '개)'
        });
    }

    var patch = { id: it.id, qty: nextQty, logs: logs, updatedAt: Date.now() };
    Store.saveItem(patch).then(function(){
        it.qty = nextQty;
        it.logs = logs;
        renderList();
        showToast(diff > 0 ? (num(diff) + '개 판매 기록됨 (잔여 ' + num(nextQty) + '개)') : ('재고 ' + num(nextQty) + '개로 변경됨'), 'ok');
    });
}

                 + '</li>';
          }).join('')
        : '<li style="color:var(--muted); font-size:13px; text-align:center; padding:12px;">아직 변동 기록이 없습니다.</li>';

    var body =
        '<div class="detail-photo" id="detailPhoto">'
      +   (small ? '<img src="' + esc(small) + '" alt="">' : '<span style="font-size:40px; opacity:.3">📦</span>')
      + '</div>'
      + '<div class="kv"><span class="k">👤 누구 꺼 (입고처)</span><span class="v">' + esc(it.owner || '-') + '</span></div>'
      + '<div class="kv"><span class="k">📅 최초 입고일</span><span class="v">' + esc(it.inDate || '-') + '</span></div>'
      + '<div class="kv"><span class="k">🔨 원가</span><span class="v">' + won(cost) + '</span></div>'
      + '<div class="kv"><span class="k">💵 현재 실판매가</span><span class="v" style="color:var(--secondary); font-size:17px;">' + won(sale) + '</span></div>'
      + '<div class="kv"><span class="k">📦 남은 재고</span><span class="v">' + num(qty) + '개</span></div>'
      + (it.memo ? '<div class="kv"><span class="k">📝 메모</span><span class="v">' + esc(it.memo) + '</span></div>' : '')
      + '<div class="log-box">'
      +   '<div class="log-title">📋 날짜별 가격 변동 · 판매(출고) 이력</div>'
      +   '<ul class="log-list" id="detailLogList">' + logHtml + '</ul>'
      + '</div>';

    var foot =
        '<button class="btn btn-success" id="mdSettleBtn">📦 마감정산</button>'
      + '<button class="btn btn-info" id="mdEditBtn">✏️ 전체수정</button>'
      + '<button class="btn btn-danger" id="mdDelBtn">🗑️ 삭제</button>';

    openModal('📦 ' + esc(it.name), body, foot);

    document.getElementById('mdSettleBtn').onclick = function(){ openSettleModal(id); };
    document.getElementById('mdEditBtn').onclick   = function(){ startEdit(id); };
    document.getElementById('mdDelBtn').onclick    = function(){ removeItem(id, false); };

    document.getElementById('detailLogList').onclick = function(e){
        var btn = e.target.closest('.log-del-btn');
        if(!btn) return;
        var idx = Number(btn.dataset.idx);
        var nextLogs = getLogs(it).slice();
        nextLogs.splice(idx, 1);
        Store.saveItem({ id: id, logs: nextLogs, updatedAt: Date.now() }).then(function(){
            it.logs = nextLogs;
            openDetail(id);
            renderList();
        });
    };

    if(it.hasPhoto){
        Store.getPhoto(id).then(function(full){
            var box = document.getElementById('detailPhoto');
            if(box && full) box.innerHTML = '<img src="' + esc(full) + '" alt="">';
        }).catch(function(){});
    }
}

/* ================== [등록 · 수정 폼] ================== */
function resetForm(){
    state.editingId = null;
    state.photoFull = null;
    state.photoThumb = null;
    state.photoTouched = false;
    document.getElementById('formTitle').textContent = '➕ 제품 등록';
    document.getElementById('formSaveBtn').textContent = '💾 저장하기';
    ['fName','fOwner','fCost','fSale','fQty','fMemo'].forEach(function(id){
        document.getElementById(id).value = '';
    });
    document.getElementById('fQty').value = 1;
    document.getElementById('fDate').value = todayStr();
    setPhotoPreview(null);
    refreshHints();
}

function setPhotoPreview(dataUrl){
    var box = document.getElementById('photoPreview');
    var clearBtn = document.getElementById('photoClearBtn');
    if(dataUrl){
        box.innerHTML = '<img src="' + esc(dataUrl) + '" alt="미리보기">';
        clearBtn.classList.remove('hidden');
    }else{
        box.innerHTML = '<div class="ph"><span class="big">📷</span>사진 올리기 (선택)</div>';
        clearBtn.classList.add('hidden');
    }
}

function handlePhotoFile(file){
    if(!file || !/^image\//.test(file.type)) return;
    showLoading('사진 압축 중…');
    makePhotoPair(file).then(function(pair){
        state.photoFull = pair.full;
        state.photoThumb = pair.thumb;
        state.photoTouched = true;
        setPhotoPreview(pair.thumb);
        hideLoading();
    }).catch(function(){ hideLoading(); });
}

function refreshHints(){
    var cost = Number(document.getElementById('fCost').value) || 0;
    var sale = Number(document.getElementById('fSale').value) || 0;
    document.getElementById('hCost').textContent = cost ? won(cost) : '';
    document.getElementById('hSale').textContent = sale ? won(sale) : '';
}

function saveFromForm(stayOnForm){
    var name = document.getElementById('fName').value.trim();
    if(!name){
        showToast('제품 이름을 입력해 주세요.', 'err');
        document.getElementById('fName').focus();
        return;
    }
    var owner  = document.getElementById('fOwner').value.trim();
    var inDate = document.getElementById('fDate').value || todayStr();
    var cost   = Number(document.getElementById('fCost').value) || 0;
    var sale   = Number(document.getElementById('fSale').value) || 0;
    var qtyRaw = document.getElementById('fQty').value;
    var qty    = qtyRaw === '' ? 0 : Math.max(0, Number(qtyRaw));
    var memo   = document.getElementById('fMemo').value.trim();

    var editing = state.editingId;
    var prev = editing ? state.items.find(function(x){ return x.id === editing; }) : null;
    var id = editing || newId();
    var now = Date.now();

    var logs = prev ? getLogs(prev).slice() : [];
    if(!prev){
        logs.unshift({
            type: 'in',
            date: inDate,
            text: '최초 입고 ' + num(qty) + '개 (원가 ' + won(cost) + ' · 실판매가 ' + won(sale) + ')'
        });
    }else{
        var prevCost = getCost(prev);
        var prevSale = Number(prev.salePrice) || 0;
        var prevQty  = Number(prev.qty) || 0;
        var diffParts = [];
        if(sale !== prevSale) diffParts.push('실판매가 ' + won(prevSale) + '→' + won(sale));
        if(cost !== prevCost) diffParts.push('원가 ' + won(prevCost) + '→' + won(cost));
        if(diffParts.length){
            logs.unshift({ type: 'price', date: todayStr(), text: diffParts.join(' / ') });
        }
        if(qty !== prevQty){
            var d = prevQty - qty;
            logs.unshift({
                type: d > 0 ? 'sale' : 'in',
                date: todayStr(),
                text: d > 0 ? (num(d) + '개 판매 (실판매가 ' + won(sale) + ' · 잔여 ' + num(qty) + '개)')
                            : (num(-d) + '개 추가 (잔여 ' + num(qty) + '개)')
            });
        }
    }

    var item = {
        id: id,
        name: name,
        owner: owner,
        costPrice: cost,
        auctionPrice: cost,
        salePrice: sale,
        qty: qty,
        inDate: inDate,
        memo: memo,
        logs: logs,
        hasPhoto: state.photoTouched ? !!state.photoFull : (prev ? !!prev.hasPhoto : false),
        createdAt: prev ? prev.createdAt : now,
        updatedAt: now
    };

    showLoading('저장 중…');
    var chain = Store.saveItem(item);
    if(state.photoTouched){
        chain = chain
            .then(function(){ return state.photoFull ? Store.savePhoto(id, state.photoFull) : Store.deletePhoto(id); })
            .then(function(){ return state.photoThumb ? Store.saveThumb(id, state.photoThumb) : Store.deleteThumb(id); })
            .then(function(){
                if(state.photoThumb) state.thumbs[id] = state.photoThumb;
                else delete state.thumbs[id];
            });
    }

    chain.then(function(){
        if(prev) Object.assign(prev, item);
        else state.items.unshift(item);
        hideLoading();
        showToast(editing ? '수정되었습니다 ✏️' : '등록되었습니다 📦', 'ok');
        resetForm();
        renderList();
        if(stayOnForm){
            switchTab('form');
            document.getElementById('fName').focus();
        }else{
            switchTab('list');
        }
    }).catch(function(e){
        hideLoading();
        showToast('저장 실패: ' + (e.message || e), 'err');
    });
}

function startEdit(id){
    var it = state.items.find(function(x){ return x.id === id; });
    if(!it) return;
    closeModal();
    state.editingId = id;
    state.photoTouched = false;
    state.photoFull = null;
    state.photoThumb = state.thumbs[id] || it.thumb || null;
    document.getElementById('formTitle').textContent = '✏️ 제품 수정';
    document.getElementById('formSaveBtn').textContent = '💾 수정 저장';
    document.getElementById('fName').value  = it.name || '';
    document.getElementById('fOwner').value = it.owner || '';
    document.getElementById('fDate').value  = it.inDate || todayStr();
    document.getElementById('fCost').value  = getCost(it) || '';
    document.getElementById('fSale').value  = it.salePrice || '';
    document.getElementById('fQty').value   = Number(it.qty) || 0;
    document.getElementById('fMemo').value  = it.memo || '';
    setPhotoPreview(state.photoThumb);
    refreshHints();
    switchTab('form');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function removeItem(id, skipConfirm){
    var it = state.items.find(function(x){ return x.id === id; });
    if(!it) return;
    if(!skipConfirm && !confirm('「' + it.name + '」 제품을 삭제할까요?')) return;

    showLoading('삭제 중…');
    Store.deleteItem(id)
        .then(function(){ return it.hasPhoto ? Store.deletePhoto(id) : null; })
        .then(function(){ return Store.deleteThumb(id); })
        .then(function(){
            delete state.thumbs[id];
            state.items = state.items.filter(function(x){ return x.id !== id; });
            hideLoading();
            closeModal();
            renderList();
            showToast('삭제했습니다 🗑️', 'ok');
        });
}

/* ================== [모달 & 탭 전환] ================== */
function openModal(title, bodyHtml, footHtml){
    var root = document.getElementById('modalRoot');
    root.innerHTML =
        '<div class="modal-back" id="modalBack">'
      +   '<div class="modal">'
      +     '<div class="modal-head"><h3>' + title + '</h3>'
      +       '<button class="modal-close" id="modalCloseBtn">✕</button></div>'
      +     '<div class="modal-body">' + bodyHtml + '</div>'
      +     (footHtml ? '<div class="modal-foot">' + footHtml + '</div>' : '')
      +   '</div>'
      + '</div>';
    document.body.style.overflow = 'hidden';
    document.getElementById('modalCloseBtn').onclick = closeModal;
    document.getElementById('modalBack').onclick = function(e){
        if(e.target.id === 'modalBack') closeModal();
    };
}
function closeModal(){
    document.getElementById('modalRoot').innerHTML = '';
    document.body.style.overflow = '';
}

function switchTab(name){
    ['list','form'].forEach(function(t){
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
    });
    document.querySelectorAll('.tab-btn').forEach(function(b){
        b.classList.toggle('active', b.dataset.tab === name);
    });
}

function renderConn(){
    var badge = document.getElementById('connBadge');
    if(Store.mode === 'cloud'){
        badge.className = 'conn-badge cloud';
        badge.textContent = '☁️ 연결됨';
    }else{
        badge.className = 'conn-badge local';
        badge.textContent = '💾 로컬모드';
    }
}

function loadAll(){
    showLoading('불러오는 중…');
    return Store.listItems().then(function(items){
        state.items = items || [];
        state.items.sort(function(a, b){ return (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0); });
        hideLoading();
        renderList();
        autoCleanLegacyPhotos(); // 옛 사진 백그라운드 자동 정리
    }).catch(function(e){
        hideLoading();
        showToast('불러오기 실패: ' + (e.message || e), 'err');
    });
}

/* ================== [이벤트 연결] ================== */
function bindEvents(){
    document.querySelectorAll('.tab-btn').forEach(function(b){
        b.onclick = function(){
            if(b.dataset.tab === 'form' && state.editingId) resetForm();
            switchTab(b.dataset.tab);
        };
    });

    document.getElementById('refreshBtn').onclick = function(){
        loadAll().then(function(){ showToast('새로고침 완료 🔄', 'ok'); });
    };

    document.getElementById('searchInput').oninput = function(e){
        state.search = e.target.value;
        renderList();
    };
    document.getElementById('sortSelect').onchange = function(e){
        state.sort = e.target.value;
        renderList();
    };
    document.querySelectorAll('.chip[data-filter]').forEach(function(c){
        c.onclick = function(){
            state.filter = c.dataset.filter;
            document.querySelectorAll('.chip[data-filter]').forEach(function(x){ x.classList.toggle('on', x === c); });
            renderList();
        };
    });

    /* 📱 카드: 길게 눌러서 삭제 + 마감정산 + 수량 +/- + 가격변경 */
    var gridEl = document.getElementById('itemGrid');
    var pressTimer = null;
    var longPressed = false;

    gridEl.addEventListener('touchstart', function(e){
        var card = e.target.closest('.item-card');
        if(!card || e.target.closest('button')) return;
        longPressed = false;
        pressTimer = setTimeout(function(){
            longPressed = true;
            gridEl.querySelectorAll('.item-card.show-del').forEach(function(c){ c.classList.remove('show-del'); });
            card.classList.add('show-del');
            if(navigator.vibrate) navigator.vibrate(45);
        }, 500);
    }, { passive: true });

    var clearPress = function(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
    gridEl.addEventListener('touchend', clearPress);
    gridEl.addEventListener('touchmove', clearPress);
    gridEl.addEventListener('touchcancel', clearPress);
    gridEl.addEventListener('contextmenu', function(e){
        if(e.target.closest('.item-card')) e.preventDefault();
    });

    gridEl.onclick = function(e){
        if(longPressed){ longPressed = false; return; }
        var card = e.target.closest('.item-card');
        if(!card) return;
        var id = card.dataset.id;
        var it = state.items.find(function(x){ return x.id === id; });
        if(!it) return;

        if(e.target.closest('.card-del-confirm')){
            e.stopPropagation();
            removeItem(id, true);
            return;
        }
        if(e.target.closest('.card-del-cancel') || card.classList.contains('show-del')){
            e.stopPropagation();
            card.classList.remove('show-del');
            return;
        }
        if(e.target.closest('.card-price-edit')){
            e.stopPropagation();
            openPriceModal(id);
            return;
        }
        if(e.target.closest('.card-qty-settle')){
            e.stopPropagation();
            openSettleModal(id);
            return;
        }
        if(e.target.closest('.card-qty-minus') || e.target.closest('.card-qty-plus')){
            e.stopPropagation();
            var delta = e.target.closest('.card-qty-plus') ? 1 : -1;
            var nextQty = Math.max(0, (Number(it.qty) || 0) + delta);
            applyQtyChange(it, nextQty, todayStr());
            return;
        }

        openDetail(id);
    };

    /* 사진 업로드 */
    var captureInput = document.getElementById('captureInput');
    var pickInput = document.getElementById('pickInput');
    document.getElementById('captureBtn').onclick = function(){ captureInput.click(); };
    document.getElementById('pickBtn').onclick = function(){ pickInput.click(); };
    captureInput.onchange = function(e){ handlePhotoFile(e.target.files[0]); e.target.value = ''; };
    pickInput.onchange    = function(e){ handlePhotoFile(e.target.files[0]); e.target.value = ''; };
    document.getElementById('photoClearBtn').onclick = function(){
        state.photoFull = null; state.photoThumb = null; state.photoTouched = true;
        setPhotoPreview(null);
    };

    /* 폼 입력 */
    ['fCost','fSale'].forEach(function(id){
        document.getElementById(id).addEventListener('input', refreshHints);
    });
    document.getElementById('formSaveBtn').onclick = function(){ saveFromForm(false); };
    document.getElementById('formSaveNextBtn').onclick = function(){ saveFromForm(true); };
    document.getElementById('formResetBtn').onclick = resetForm;
}

document.addEventListener('DOMContentLoaded', function(){
    bindEvents();
    resetForm();
    Store.init().then(function(){
        renderConn();
        return loadAll();
    });
});
</script>
</body>
</html>
